name: 성능 결과
description: 재현 가능한 성능 저하나 벤치마크 결과를 공유해주세요.
title: "[성능]: "
labels: [performance]
body:
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경과 데이터
      description: 하드웨어, 소프트웨어 버전, 요청 경로, 응답 크기, 데이터 건수를 알려주세요.
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: 측정 절차와 원본 결과
      description: 예열 시간, 측정 시간, 동시 요청 수, p50/p95/p99, 초당 요청 수, 오류, CPU·DB·Redis 지표를 첨부해주세요.
    validations:
      required: true
