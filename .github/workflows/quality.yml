name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / G7 ${{ matrix.g7 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        g7: ['7.0.8', '7.0.9']
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout JW PowerCache
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout Gnuboard 7
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gnuboard/g7
          ref: ${{ matrix.g7 }}
          path: g7

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Validate package metadata
        run: composer validate --strict --no-check-publish

      - name: Install Gnuboard dependencies
        working-directory: g7
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Check PHP syntax
        run: find src tests database config -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check code style
        run: g7/vendor/bin/pint --test src tests database plugin.php

      - name: Run unit, feature, and Redis integration tests
        env:
          G7_ROOT: ${{ github.workspace }}/g7
          JW_POWER_CACHE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: tool/test.sh

  database:
    name: ${{ matrix.database.name }} transaction contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
          - name: MariaDB 11.4
            image: mariadb:11.4
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jw_power_cache_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout JW PowerCache
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout supported Gnuboard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gnuboard/g7
          ref: 7.0.9
          path: g7

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install Gnuboard dependencies
        working-directory: g7
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run full suite against the real database engine
        env:
          G7_ROOT: ${{ github.workspace }}/g7
          JW_POWER_CACHE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          JW_POWER_CACHE_TEST_DB_DRIVER: mysql
          JW_POWER_CACHE_TEST_DB_HOST: 127.0.0.1
          JW_POWER_CACHE_TEST_DB_PORT: 3306
          JW_POWER_CACHE_TEST_DB_DATABASE: jw_power_cache_test
          JW_POWER_CACHE_TEST_DB_USERNAME: root
          JW_POWER_CACHE_TEST_DB_PASSWORD: root
          JW_POWER_CACHE_TEST_DB_ALLOW_DESTRUCTIVE: '1'
        run: tool/test.sh
