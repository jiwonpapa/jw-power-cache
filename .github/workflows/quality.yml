name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  G7_REPOSITORY: gnuboard/g7
  G7_REF: 56836a2b66c3bc4c3ae84ab1ae983248bb6d40b0

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / official G7 7.0.9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout JW PowerCache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout Gnuboard 7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.G7_REPOSITORY }}
          ref: ${{ env.G7_REF }}
          path: g7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Validate package metadata
        run: composer validate --strict --no-check-publish

      - name: Install Gnuboard dependencies
        working-directory: g7
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Check PHP syntax
        run: find src tests database config tool -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check shell syntax
        run: bash -n tool/*.sh

      - name: Check code style
        run: g7/vendor/bin/pint --test src tests database tool plugin.php

      - name: Verify release archive contract
        if: matrix.php == '8.5'
        env:
          JWPC_RELEASE_VERIFY_ONLY: '1'
        run: tool/build-release.sh

      - name: Run unit, feature, and Redis integration tests
        env:
          G7_ROOT: ${{ github.workspace }}/g7
          JW_POWER_CACHE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: tool/test.sh

  database:
    name: ${{ matrix.database.name }} transaction contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            health_cmd: mysqladmin ping -h 127.0.0.1 -proot
          - name: MariaDB 11.4
            image: mariadb:11.4
            health_cmd: mariadb-admin ping -h 127.0.0.1 -proot
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jw_power_cache_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jw_power_cache_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.database.health_cmd }}"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout JW PowerCache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout supported Gnuboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.G7_REPOSITORY }}
          ref: ${{ env.G7_REF }}
          path: g7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install Gnuboard dependencies
        working-directory: g7
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run full suite against the real database engine
        env:
          G7_ROOT: ${{ github.workspace }}/g7
          JW_POWER_CACHE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          JW_POWER_CACHE_TEST_DB_DRIVER: mysql
          JW_POWER_CACHE_TEST_DB_HOST: 127.0.0.1
          JW_POWER_CACHE_TEST_DB_PORT: 3306
          JW_POWER_CACHE_TEST_DB_DATABASE: jw_power_cache_test
          JW_POWER_CACHE_TEST_DB_USERNAME: root
          JW_POWER_CACHE_TEST_DB_PASSWORD: root
          JW_POWER_CACHE_TEST_DB_ALLOW_DESTRUCTIVE: '1'
        run: tool/test.sh
