name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  G7_REPOSITORY: gnuboard/g7
  G7_REF: 56836a2b66c3bc4c3ae84ab1ae983248bb6d40b0

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout JW PowerCache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Checkout supported Gnuboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.G7_REPOSITORY }}
          ref: ${{ env.G7_REF }}
          path: g7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate and install test dependencies
        run: composer validate --strict --no-check-publish

      - name: Install Gnuboard dependencies
        working-directory: g7
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Check syntax and style
        run: |
          find src tests database config -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          g7/vendor/bin/pint --test src tests database plugin.php

      - name: Run release tests
        env:
          G7_ROOT: ${{ github.workspace }}/g7
          JW_POWER_CACHE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: tool/test.sh

      - name: Build release archive
        run: tool/build-release.sh "$GITHUB_REF_NAME"

      - name: Attest release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/jw-power_cache-*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=("$GITHUB_REF_NAME" dist/* --verify-tag --title "JW PowerCache $GITHUB_REF_NAME")
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
